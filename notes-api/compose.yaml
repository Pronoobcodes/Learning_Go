
services:
  db:
    image: postgres:17
    container_name: notes-bookmarks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: notes_bookmarks
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d notes_bookmarks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
