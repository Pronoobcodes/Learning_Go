services:
  db:
    image: postgres:17
    container_name: url-shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: url_shortener
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: